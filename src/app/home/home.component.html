<div class="container mt-4">
  <h2>List of Tasks</h2>

  <ul class="list-group">
    <li *ngFor="let task of tasks" class="list-group-item d-flex justify-content-between align-items-center">
      <div style="text-align: left;">
        <h5>{{ task.title }}</h5>
        <p class="mb-0 text-muted">{{ task.description }}</p>
      </div>

      <div style="display: flex; gap: 10px;">
        <!-- TODO: Add Buttons here -->
        <span class="badge" [class.bg-success]="task.completed" [class.bg-warning]="!task.completed">
          {{ task.completed ? 'Done' : 'Pending' }}
        </span>
      </div>
    </li>
  </ul>

  <!-- If no tasks exist -->
  <div *ngIf="tasks.length === 0" class="alert alert-info mt-3">
    No tasks for now. Try adding one!
  </div>

  <!-- Form to add new tasks -->
  <div class="card mt-3">
    <div class="card-header">Add New Task</div>
    <div class="card-body">
      <form>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" class="form-control" id="title" placeholder="Enter task title">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea class="form-control" id="description" rows="3" placeholder="Enter task description"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </form>
    </div>
  </div>
</div>
