<div class="container mt-4">
  <h2>List of Tasks</h2>

  <ul class="list-group">
    <li *ngFor="let task of tasks" class="list-group-item d-flex justify-content-between align-items-center">
      <div style="text-align: left;">
        <h5>{{ task.title }}</h5>
        <p class="mb-0 text-muted">{{ task.description }}</p>
      </div>

      <div style="display: flex; gap: 10px;">
        <button class="btn btn-sm" [class.btn-outline-success]="!task.completed"
          [class.btn-outline-secondary]="task.completed" (click)="updateTaskStatus(task.id, !task.completed)">
          {{ task.completed ? 'Undo' : 'Complete' }}
        </button>

        <button class="btn btn-sm btn-danger" (click)="deleteTask(task.id)">Delete</button>
      </div>
    </li>
  </ul>

  <!-- If no tasks exist -->
  <div *ngIf="tasks.length === 0" class="alert alert-info mt-3">
    No tasks for now. Try adding one!
  </div>

  <!-- Form to add new tasks -->
  <div class="card mt-3">
    <div class="card-header">Add New Task</div>
    <div class="card-body">
      <form #taskForm="ngForm">
        <div class="form-group">
          <label for="title">Title</label>
          <input [(ngModel)]="task.title" type="text" class="form-control" name="title" placeholder="Enter task title">
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea [(ngModel)]="task.description" class="form-control" name="description" rows="3"
            placeholder="Enter task description"></textarea>
        </div>
        <button type="submit" class="btn btn-primary" (click)="addTask()">Add Task</button>
      </form>
    </div>
  </div>
</div>
